name: Concurro Demo CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: demo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stacks-common:
    name: Demo Rust
    if: github.repository == 'concurro-demo-upstream/stacks-core' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/concurro-demo-rust

  warm-cache:
    name: Warm demo Rust cache
    if: >-
      github.repository == 'concurro-demo-upstream/stacks-core' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/concurro-demo-rust
        with:
          warm-cache: 'true'
